# «Цветы без повода» – боевой сайт tsvetibezpovoda.ru. Заявки – общий приёмник cvety-leads (deploy/stend/compose.yml).
name: cvety-prod
services:
  cvety-prod-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: cvety-prod-web
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./redirects:/etc/nginx/cvety:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [proxy]
networks:
  proxy:
    name: caddy
    external: true
