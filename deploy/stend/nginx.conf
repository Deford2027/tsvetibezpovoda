# Статика (Astro). Слушает только внутри сети docker; TLS и заголовки – в общем Caddy (/opt/caddy/Caddyfile, блок cvety).
map_hash_bucket_size 256;
map $uri $cvety_to {
    default "";
    include /etc/nginx/cvety/redirects.map;
}
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
limit_req_zone $binary_remote_addr zone=lead:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=crm:1m rate=60r/m;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 1k;
    if ($cvety_to) { return 301 $cvety_to$is_args$args; }
    error_page 404 /404.html;

    # Заявки: приёмник cvety-leads. Имя через resolver – nginx стартует и без него.
    location = /lead {
        limit_req zone=lead burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=30s;
        set $leads cvety-leads:8080;
        proxy_pass http://$leads;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /crm/ {
        limit_req zone=crm burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=30s;
        set $crm cvety-leads:8080;
        proxy_pass http://$crm;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location ~* \.(js|css|svg|woff2?|webp)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
