<script>(function(){
var K='tbp_admin_auth',L='tbp_admin_keep',box=JSON.parse(document.getElementById('lock-data').textContent),f=document.getElementById('lock-form'),err=f.querySelector('.err');
var openBox=async function openBox(box, login, pass) {
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(login + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
  var kek = function (salt) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(salt), iterations: box.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  };
  var key = null;
  if (box.keys) {
    for (var i = 0; i < box.keys.length && !key; i++) {
      try {
        var w = box.keys[i];
        var raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.iv) }, await kek(w.salt), b64(w.key));
        key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      } catch (e) {}
    }
    if (!key) throw new Error('неверный логин или пароль');
  } else key = await kek(box.salt);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(box.iv) }, key, b64(box.data)));
};
async function open(login,pass,quiet,keep){
  try{
    var html=await openBox(box,login,pass);
  }catch(e){try{sessionStorage.removeItem(K);if(quiet)localStorage.removeItem(L)}catch(_){} if(!quiet)err.textContent='Неверный логин или пароль';return}

  try{sessionStorage.setItem(K,a);if(keep)localStorage.setItem(L,a)}catch(_){}

  document.body.querySelectorAll('script').forEach(function(o){var s=document.createElement('script');for(var i=0;i<o.attributes.length;i++)s.setAttribute(o.attributes[i].name,o.attributes[i].value);s.textContent=o.textContent;o.replaceWith(s)});
}
